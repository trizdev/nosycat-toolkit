name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Source commit to test (exact 40-character lowercase SHA)
        required: true
        type: string

permissions:
  contents: read

env:
  TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || '' }}
  WORKFLOW_SHA: ${{ github.workflow_sha }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: validate target SHA
        id: target
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be exactly 40 lowercase hexadecimal characters"
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        id: checkout
        with:
          ref: ${{ env.TARGET_SHA }} # Empty on push/PR: preserve the event's default checkout.
          persist-credentials: false
      - name: verify source SHA
        id: source
        run: |
          source_sha="$(git rev-parse HEAD)"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$source_sha" == "$TARGET_SHA" ]]
          fi
      - name: bash -n
        id: syntax
        run: for f in nosycat.sh lib/*.sh modules/*.sh scripts/*.sh tests/helpers.bash tests/stubs/*; do bash -n "$f"; done
      - name: shellcheck
        id: shellcheck
        run: shellcheck -x nosycat.sh lib/*.sh modules/*.sh scripts/*.sh tests/helpers.bash tests/stubs/*
      - name: job summary
        if: ${{ always() }}
        env:
          TESTED_SHA: ${{ steps.source.outputs.sha }}
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          {
            printf 'Workflow SHA: %s\n\nSource SHA: %s\n\n' "$WORKFLOW_SHA" "${TESTED_SHA:-unavailable}"
            printf 'Event: %s · run: %s · attempt: %s\n\n' "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf '| Step | Outcome |\n| --- | --- |\n'
            jq -r 'to_entries[] | "| \(.key) | \(.value.outcome) |"' <<< "$STEP_RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"

  bats-runner:
    runs-on: ubuntu-latest
    steps:
      - name: validate target SHA
        id: target
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be exactly 40 lowercase hexadecimal characters"
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        id: checkout
        with:
          ref: ${{ env.TARGET_SHA }} # Empty on push/PR: preserve the event's default checkout.
          persist-credentials: false
      - name: verify source SHA
        id: source
        run: |
          source_sha="$(git rev-parse HEAD)"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$source_sha" == "$TARGET_SHA" ]]
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        id: bats_checkout
        with:
          repository: bats-core/bats-core
          ref: b640ec3cf2c7c9cfc9e6351479261186f76eeec8 # v1.11.1
          path: .bats
          persist-credentials: false
      - name: bats (runner, non-root)
        id: bats
        run: |
          if [[ "$(id -u)" -eq 0 ]]; then
            echo "::error::runner Bats requires a non-root user"
            exit 1
          fi
          .bats/bin/bats tests/
      - name: job summary
        if: ${{ always() }}
        env:
          TESTED_SHA: ${{ steps.source.outputs.sha }}
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          {
            printf 'Workflow SHA: %s\n\nSource SHA: %s\n\n' "$WORKFLOW_SHA" "${TESTED_SHA:-unavailable}"
            printf 'Event: %s · run: %s · attempt: %s\n\n' "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf '| Step | Outcome |\n| --- | --- |\n'
            jq -r 'to_entries[] | "| \(.key) | \(.value.outcome) |"' <<< "$STEP_RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"

  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12", "rockylinux:9", "alpine:3.20"]
    env:
      IMAGE: ${{ matrix.image }}
      CONTAINER_NAME: nosycat-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
    steps:
      - name: validate target SHA
        id: target
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be exactly 40 lowercase hexadecimal characters"
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        id: checkout
        with:
          ref: ${{ env.TARGET_SHA }} # Empty on push/PR: preserve the event's default checkout.
          persist-credentials: false
      - name: verify source SHA
        id: source
        run: |
          source_sha="$(git rev-parse HEAD)"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$source_sha" == "$TARGET_SHA" ]]
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        id: bats_checkout
        with:
          repository: bats-core/bats-core
          ref: b640ec3cf2c7c9cfc9e6351479261186f76eeec8 # v1.11.1
          path: .bats
          persist-credentials: false
      - name: prepare container
        id: prepare
        run: |
          docker run --detach --name "$CONTAINER_NAME" --label "nosycat.ci-job=$CONTAINER_NAME" \
            -v "$PWD:/src" -w /src "$IMAGE" sh -c 'while :; do sleep 3600; done'
          docker exec "$CONTAINER_NAME" sh -ec '
            if command -v apk >/dev/null; then apk add --no-cache bash coreutils jq openssl >/dev/null; fi
            if command -v dnf >/dev/null; then dnf -y -q install procps-ng iproute findutils jq openssl >/dev/null; fi
            if command -v apt-get >/dev/null; then apt-get -qq update; apt-get -qq install -y procps iproute2 jq openssl >/dev/null; fi
          '
      - name: bats in ${{ matrix.image }}
        id: bats
        run: docker exec "$CONTAINER_NAME" bash .bats/bin/bats tests/
      - name: CLI smoke
        id: smoke
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          docker exec "$CONTAINER_NAME" sh -ec '
            rc=0; bash ./nosycat.sh --no-color || rc=$?
            echo "text exit code: $rc"; [ "$rc" -le 2 ]
            rc=0; bash ./nosycat.sh --format json > /src/report.json || rc=$?
            [ "$rc" -le 2 ]
            rc=0; bash ./nosycat.sh --format md --only system,network > /dev/null || rc=$?
            [ "$rc" -le 2 ]
            rc=0; bash ./nosycat.sh -q --no-color || rc=$?
            echo "problems-only exit code: $rc"; [ "$rc" -le 2 ]
            rc=0; bash ./nosycat.sh -q --format json > /src/report-q.json || rc=$?
            [ "$rc" -le 2 ]
            bash ./nosycat.sh --snapshot --state-dir /tmp/nosy
            rc=0; bash ./nosycat.sh --diff --state-dir /tmp/nosy --no-color || rc=$?
            [ "$rc" -le 2 ]
            rc=0; bash ./nosycat.sh --bogus 2>/dev/null || rc=$?
            [ "$rc" -eq 3 ]
          '
      - name: validate json report
        id: json
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        run: |
          jq -e '.schema_version == "1" and .summary and (.checks | length > 0)' report.json
          jq -e '.problems_only and ([.checks[] | select(.status != "WARN" and .status != "FAIL")] | length == 0)' report-q.json
          jq -e '[.checks[].id] | index("BKP-001") != null' report.json
      - name: cleanup container
        id: cleanup
        if: ${{ always() }}
        run: |
          container_id="$(docker ps -aq --filter "name=^/${CONTAINER_NAME}$" --filter "label=nosycat.ci-job=$CONTAINER_NAME")"
          if [[ -n "$container_id" ]]; then
            docker rm -f "$container_id"
          fi
      - name: job summary
        if: ${{ always() }}
        env:
          TESTED_SHA: ${{ steps.source.outputs.sha }}
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          {
            printf 'Workflow SHA: %s\n\nSource SHA: %s\n\n' "$WORKFLOW_SHA" "${TESTED_SHA:-unavailable}"
            printf 'Event: %s · run: %s · attempt: %s\n\n' "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf '| Step | Outcome |\n| --- | --- |\n'
            jq -r 'to_entries[] | "| \(.key) | \(.value.outcome) |"' <<< "$STEP_RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"
